<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>Reader | LANGITMALAM</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0b0b;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Fixed Top Navigation */
    .nav-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 50px;
      padding: 0 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 11, 11, 0.98);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 1000;
    }
    .nav-left, .nav-right { display: flex; align-items: center; gap: 8px; }
    .nav-bar a {
      color: #aaa;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #e0e0e0;
      padding: 5px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      border-radius: 3px;
    }
    .nav-btn:active { background: rgba(255, 255, 255, 0.25); }
    #status { font-size: 0.75rem; opacity: 0.7; }

    /* Scrollable Container (Fixed Viewport) */
    .viewport {
      position: fixed;
      top: 50px;
      bottom: 56px;
      left: 0;
      right: 0;
      overflow-y: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
      padding: 16px 10px;
      display: flex;
      justify-content: center;
    }

    .content-wrapper {
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: width 0.15s ease-out;
    }

    /* Scroll Mode: Pages stack vertically with natural scrolling */
    #scroll-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 650px;
    }
    #scroll-view canvas {
      width: 100% !important;
      height: auto !important;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
      background-color: #fff;
    }

    /* Book Flip Mode */
    #flipbook { display: none; }
    .page { background-color: #fff; }
    .page canvas { width: 100% !important; height: 100% !important; display: block; }

    /* Bottom Navigation Bar */
    .controls {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 1000;
      background: rgba(18, 18, 18, 0.9);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .controls button {
      background: none;
      border: none;
      color: #e0e0e0;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <div class="nav-left">
      <a href="index.html">← Back</a>
      <button class="nav-btn" id="mode-btn">Mode: Scroll</button>
    </div>
    <span id="status">Loading...</span>
    <div class="nav-right">
      <button class="nav-btn" id="zoom-out">−</button>
      <span id="zoom-val" style="font-size:0.75rem;">100%</span>
      <button class="nav-btn" id="zoom-in">+</button>
    </div>
  </div>

  <div class="viewport" id="scroll-container">
    <div class="content-wrapper" id="content-area">
      <div id="scroll-view"></div>
      <div id="flipbook"></div>
    </div>
  </div>

  <div class="controls" id="flip-controls" style="display: none;">
    <button id="prev-btn">‹ Prev</button>
    <button id="next-btn">Next ›</button>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const urlParams = new URLSearchParams(window.location.search);
    const pdfUrl = urlParams.get('file') || 'letters-i-never-sent.pdf';

    const statusText = document.getElementById('status');
    const scrollContainer = document.getElementById('scroll-view');
    const flipContainer = document.getElementById('flipbook');
    const contentArea = document.getElementById('content-area');
    const zoomVal = document.getElementById('zoom-val');
    const modeBtn = document.getElementById('mode-btn');
    const flipControls = document.getElementById('flip-controls');

    let currentZoom = 1.0;
    // Default mobile phones to scroll mode automatically
    let isScrollMode = window.innerWidth <= 768;
    let pageFlip = null;

    function applyZoom(val) {
      currentZoom = Math.min(Math.max(val, 0.8), 2.2);
      zoomVal.innerText = `${Math.round(currentZoom * 100)}%`;

      if (isScrollMode) {
        // Expand real DOM dimensions so native vertical scrolling works effortlessly
        const baseWidth = Math.min(window.innerWidth * 0.94, 650);
        scrollContainer.style.maxWidth = `${baseWidth * currentZoom}px`;
      } else {
        contentArea.style.transform = `scale(${currentZoom})`;
        contentArea.style.transformOrigin = 'top center';
      }
    }

    document.getElementById('zoom-in').onclick = () => applyZoom(currentZoom + 0.2);
    document.getElementById('zoom-out').onclick = () => applyZoom(currentZoom - 0.2);

    pdfjsLib.getDocument(pdfUrl).promise.then(async (pdf) => {
      statusText.innerText = `Loading...`;

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 2.0 }); // 2x DPI for crisp text

        // Render for Scroll Mode
        const sCanvas = document.createElement('canvas');
        sCanvas.width = viewport.width;
        sCanvas.height = viewport.height;
        await page.render({ canvasContext: sCanvas.getContext('2d'), viewport }).promise;
        scrollContainer.appendChild(sCanvas);

        // Render for Flipbook Mode
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';
        const fCanvas = document.createElement('canvas');
        fCanvas.width = viewport.width;
        fCanvas.height = viewport.height;
        await page.render({ canvasContext: fCanvas.getContext('2d'), viewport }).promise;
        pageDiv.appendChild(fCanvas);
        flipContainer.appendChild(pageDiv);

        statusText.innerText = `${i}/${pdf.numPages}`;
      }

      statusText.innerText = '';

      // Initialize Flipbook
      const bookWidth = Math.min(window.innerWidth * 0.9, 440);
      const bookHeight = bookWidth * 1.45;

      pageFlip = new St.PageFlip(flipContainer, {
        width: bookWidth,
        height: bookHeight,
        size: 'stretch',
        minWidth: 260,
        maxWidth: 500,
        minHeight: 380,
        maxHeight: 750,
        showCover: true,
        drawShadow: true,
        mobileScrollSupport: true // Allows vertical scrolling through touches
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));

      document.getElementById('prev-btn').onclick = () => pageFlip.flipPrev();
      document.getElementById('next-btn').onclick = () => pageFlip.flipNext();

      pageFlip.on('flip', (e) => {
        statusText.innerText = `${e.data + 1} / ${pdf.numPages}`;
      });

      // Switch View Modes
      function updateViewMode() {
        if (isScrollMode) {
          flipContainer.style.display = 'none';
          scrollContainer.style.display = 'flex';
          flipControls.style.display = 'none';
          modeBtn.innerText = 'Mode: Scroll';
          contentArea.style.transform = 'none';
          applyZoom(1.0);
        } else {
          flipContainer.style.display = 'block';
          scrollContainer.style.display = 'none';
          flipControls.style.display = 'flex';
          modeBtn.innerText = 'Mode: Book';
          scrollContainer.style.maxWidth = '650px';
          applyZoom(1.0);
        }
      }

      modeBtn.onclick = () => {
        isScrollMode = !isScrollMode;
        updateViewMode();
      };

      updateViewMode();

    }).catch(err => {
      statusText.innerText = 'Error loading book.';
      console.error(err);
    });
  </script>
</body>
</html>
