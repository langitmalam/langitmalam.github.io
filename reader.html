<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>Reader | LANGITMALAM</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0b0b;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Fixed Navigation */
    .nav-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 50px;
      padding: 0 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 11, 11, 0.98);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 1000;
    }
    .nav-left, .nav-right { display: flex; align-items: center; gap: 8px; }
    .nav-bar a {
      color: #aaa;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #e0e0e0;
      padding: 5px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      border-radius: 3px;
    }
    .nav-btn:active { background: rgba(255, 255, 255, 0.25); }
    #status { font-size: 0.75rem; opacity: 0.7; }

    /* Scrollable Viewport */
    .viewport {
      position: fixed;
      top: 50px;
      bottom: 56px;
      left: 0;
      right: 0;
      overflow-y: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
      padding: 16px 10px;
      display: flex;
      justify-content: center;
    }

    .content-wrapper {
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: width 0.15s ease-out;
    }

    /* Scroll View */
    #scroll-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 650px;
    }
    #scroll-view canvas {
      width: 100% !important;
      height: auto !important;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
      background-color: #fff;
    }

    /* Flipbook */
    #flipbook { display: block; }
    .page { background-color: #fff; }
    .page canvas { width: 100% !important; height: 100% !important; display: block; }

    .view-hidden {
      position: absolute !important;
      left: -9999px !important;
      top: -9999px !important;
      visibility: hidden !important;
      pointer-events: none !important;
      opacity: 0 !important;
    }

    /* Bottom Controls */
    .controls {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 1000;
      background: rgba(18, 18, 18, 0.9);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .controls button {
      background: none;
      border: none;
      color: #e0e0e0;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Bookmark Notification Banner */
    #resume-banner {
      position: fixed;
      bottom: 68px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(26, 26, 26, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.8rem;
      display: none;
      gap: 12px;
      align-items: center;
      z-index: 2000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
    }
    #resume-banner button {
      background: #e0e0e0;
      color: #0b0b0b;
      border: none;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }
    #resume-banner span.dismiss {
      color: #777;
      cursor: pointer;
      font-size: 0.9rem;
      padding-left: 4px;
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <div class="nav-left">
      <a href="index.html">← Back</a>
      <button class="nav-btn" id="mode-btn">Mode: Scroll</button>
    </div>
    <span id="status">Loading...</span>
    <div class="nav-right">
      <button class="nav-btn" id="zoom-out">−</button>
      <span id="zoom-val" style="font-size:0.75rem;">100%</span>
      <button class="nav-btn" id="zoom-in">+</button>
    </div>
  </div>

  <div class="viewport" id="scroll-container">
    <div class="content-wrapper" id="content-area">
      <div id="scroll-view"></div>
      <div id="flipbook" class="view-hidden"></div>
    </div>
  </div>

  <!-- Bookmark Prompt Banner -->
  <div id="resume-banner">
    <span id="resume-text">Resume from page 1?</span>
    <button id="resume-btn">Resume</button>
    <span class="dismiss" id="dismiss-btn">✕</span>
  </div>

  <div class="controls" id="flip-controls" style="display: none;">
    <button id="prev-btn">‹ Prev</button>
    <button id="next-btn">Next ›</button>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const urlParams = new URLSearchParams(window.location.search);
    const pdfUrl = urlParams.get('file') || 'letters-i-never-sent.pdf';
    const bookmarkKey = `langitmalam_bookmark_${pdfUrl}`;

    const statusText = document.getElementById('status');
    const scrollContainer = document.getElementById('scroll-container');
    const scrollView = document.getElementById('scroll-view');
    const flipContainer = document.getElementById('flipbook');
    const contentArea = document.getElementById('content-area');
    const zoomVal = document.getElementById('zoom-val');
    const modeBtn = document.getElementById('mode-btn');
    const flipControls = document.getElementById('flip-controls');

    const resumeBanner = document.getElementById('resume-banner');
    const resumeText = document.getElementById('resume-text');
    const resumeBtn = document.getElementById('resume-btn');
    const dismissBtn = document.getElementById('dismiss-btn');

    let pdfDoc = null;
    let currentZoom = 1.0;
    let isScrollMode = window.innerWidth <= 768;
    let pageFlip = null;
    let activePageIndex = 0;

    // Zoom Handling
    function applyZoom(val) {
      currentZoom = Math.min(Math.max(val, 0.8), 2.2);
      zoomVal.innerText = `${Math.round(currentZoom * 100)}%`;

      if (isScrollMode) {
        const baseWidth = Math.min(window.innerWidth * 0.94, 650);
        scrollView.style.maxWidth = `${baseWidth * currentZoom}px`;
      } else {
        contentArea.style.transform = `scale(${currentZoom})`;
        contentArea.style.transformOrigin = 'top center';
      }
    }

    document.getElementById('zoom-in').onclick = () => applyZoom(currentZoom + 0.2);
    document.getElementById('zoom-out').onclick = () => applyZoom(currentZoom - 0.2);

    // Save Bookmark to Local Storage
    function saveBookmark(pageIdx) {
      activePageIndex = pageIdx;
      localStorage.setItem(bookmarkKey, pageIdx);
    }

    // Flipbook Initialization
    function initOrUpdateFlipBook() {
      if (!pageFlip) {
        const bookWidth = Math.min(window.innerWidth * 0.92, 440);
        const bookHeight = bookWidth * 1.45;

        pageFlip = new St.PageFlip(flipContainer, {
          width: bookWidth,
          height: bookHeight,
          size: 'stretch',
          minWidth: 260,
          maxWidth: 500,
          minHeight: 380,
          maxHeight: 750,
          showCover: true,
          drawShadow: true,
          mobileScrollSupport: true
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        document.getElementById('prev-btn').onclick = () => pageFlip.flipPrev();
        document.getElementById('next-btn').onclick = () => pageFlip.flipNext();

        pageFlip.on('flip', (e) => {
          saveBookmark(e.data);
          if (!isScrollMode && pdfDoc) {
            statusText.innerText = `${e.data + 1} / ${pdfDoc.numPages}`;
          }
        });
      } else {
        setTimeout(() => {
          pageFlip.update();
        }, 50);
      }
    }

    // View Mode Switching
    function updateViewMode() {
      if (isScrollMode) {
        flipContainer.classList.add('view-hidden');
        scrollView.style.display = 'flex';
        flipControls.style.display = 'none';
        modeBtn.innerText = 'Mode: Scroll';
        contentArea.style.transform = 'none';
        applyZoom(1.0);
        if (pdfDoc) statusText.innerText = `${pdfDoc.numPages} Pages`;
      } else {
        scrollView.style.display = 'none';
        flipContainer.classList.remove('view-hidden');
        flipControls.style.display = 'flex';
        modeBtn.innerText = 'Mode: Book';
        scrollView.style.maxWidth = '650px';
        applyZoom(1.0);

        initOrUpdateFlipBook();
        if (pageFlip && pdfDoc) {
          statusText.innerText = `${pageFlip.getCurrentPageIndex() + 1} / ${pdfDoc.numPages}`;
        }
      }
    }

    // Track scroll position to auto-save in Scroll Mode
    scrollContainer.addEventListener('scroll', () => {
      if (!isScrollMode || !pdfDoc) return;
      const canvases = scrollView.querySelectorAll('canvas');
      const containerTop = scrollContainer.getBoundingClientRect().top;

      canvases.forEach((canvas, idx) => {
        const rect = canvas.getBoundingClientRect();
        if (rect.top <= containerTop + 150 && rect.bottom >= containerTop) {
          saveBookmark(idx);
          statusText.innerText = `Page ${idx + 1} / ${pdfDoc.numPages}`;
        }
      });
    });

    // Jump to specific page
    function jumpToPage(targetIndex) {
      if (isScrollMode) {
        const canvases = scrollView.querySelectorAll('canvas');
        if (canvases[targetIndex]) {
          canvases[targetIndex].scrollIntoView({ behavior: 'smooth' });
        }
      } else {
        initOrUpdateFlipBook();
        if (pageFlip) {
          pageFlip.turnToPage(targetIndex);
        }
      }
    }

    // Check Saved Progress on Load
    function checkSavedProgress() {
      const savedPage = localStorage.getItem(bookmarkKey);
      if (savedPage !== null) {
        const pageIdx = parseInt(savedPage, 10);
        if (!isNaN(pageIdx) && pageIdx > 0 && pageIdx < pdfDoc.numPages) {
          resumeText.innerText = `Resume from page ${pageIdx + 1}?`;
          resumeBanner.style.display = 'flex';

          resumeBtn.onclick = () => {
            jumpToPage(pageIdx);
            resumeBanner.style.display = 'none';
          };
          dismissBtn.onclick = () => {
            resumeBanner.style.display = 'none';
          };
        }
      }
    }

    // Load PDF
    pdfjsLib.getDocument(pdfUrl).promise.then(async (pdf) => {
      pdfDoc = pdf;
      statusText.innerText = `Loading...`;

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 2.0 });

        // Canvas for Scroll mode
        const sCanvas = document.createElement('canvas');
        sCanvas.width = viewport.width;
        sCanvas.height = viewport.height;
        await page.render({ canvasContext: sCanvas.getContext('2d'), viewport }).promise;
        scrollView.appendChild(sCanvas);

        // Canvas for Flipbook mode
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';
        const fCanvas = document.createElement('canvas');
        fCanvas.width = viewport.width;
        fCanvas.height = viewport.height;
        await page.render({ canvasContext: fCanvas.getContext('2d'), viewport }).promise;
        pageDiv.appendChild(fCanvas);
        flipContainer.appendChild(pageDiv);

        statusText.innerText = `${i}/${pdf.numPages}`;
      }

      statusText.innerText = '';
      updateViewMode();
      checkSavedProgress();

      modeBtn.onclick = () => {
        isScrollMode = !isScrollMode;
        updateViewMode();
      };

    }).catch(err => {
      statusText.innerText = 'Error loading book.';
      console.error(err);
    });
  </script>
</body>
</html>
