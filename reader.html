<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>Reader | LANGITMALAM</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0b0b0b;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .nav-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 11, 11, 0.96);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 1000;
    }
    .nav-left, .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-bar a {
      color: #aaa;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .nav-bar a:hover { color: #fff; }
    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e0e0e0;
      padding: 5px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      border-radius: 3px;
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.2); }
    #status { font-size: 0.75rem; opacity: 0.7; }

    /* Viewer Area */
    .viewport {
      margin-top: 60px;
      margin-bottom: 70px;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: auto;
      padding: 10px;
    }
    .zoom-wrapper {
      transform-origin: top center;
      transition: transform 0.15s ease-out;
    }

    /* Flipbook view */
    #flipbook { display: block; margin: 0 auto; }
    .page { background-color: #fff; }
    .page canvas { width: 100% !important; height: 100% !important; display: block; }

    /* Scroll view (continuous reading) */
    #scroll-view { display: none; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 720px; }
    #scroll-view canvas { width: 100% !important; height: auto !important; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }

    /* Bottom Controls */
    .controls {
      position: fixed;
      bottom: 16px;
      display: flex;
      gap: 10px;
      z-index: 1000;
      background: rgba(11, 11, 11, 0.85);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .controls button {
      background: none;
      border: none;
      color: #e0e0e0;
      font-size: 0.85rem;
      padding: 4px 10px;
      cursor: pointer;
    }
    .controls button:hover { color: #fff; }
  </style>
</head>
<body>

  <div class="nav-bar">
    <div class="nav-left">
      <a href="index.html">← Back</a>
      <button class="nav-btn" id="mode-btn">Mode: Book</button>
    </div>
    <span id="status">Loading...</span>
    <div class="nav-right">
      <button class="nav-btn" id="zoom-out">−</button>
      <span id="zoom-val" style="font-size:0.75rem;">100%</span>
      <button class="nav-btn" id="zoom-in">+</button>
    </div>
  </div>

  <div class="viewport">
    <div class="zoom-wrapper" id="zoom-target">
      <div id="flipbook"></div>
      <div id="scroll-view"></div>
    </div>
  </div>

  <div class="controls" id="flip-controls">
    <button id="prev-btn">‹ Prev</button>
    <button id="next-btn">Next ›</button>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const urlParams = new URLSearchParams(window.location.search);
    const pdfUrl = urlParams.get('file') || 'letters-i-never-sent.pdf';

    const statusText = document.getElementById('status');
    const flipContainer = document.getElementById('flipbook');
    const scrollContainer = document.getElementById('scroll-view');
    const zoomTarget = document.getElementById('zoom-target');
    const zoomVal = document.getElementById('zoom-val');

    let currentZoom = 1.0;
    let isScrollMode = false;
    let pageFlip = null;

    // Zoom Controls
    function setZoom(val) {
      currentZoom = Math.min(Math.max(val, 0.8), 2.5);
      zoomTarget.style.transform = `scale(${currentZoom})`;
      zoomVal.innerText = `${Math.round(currentZoom * 100)}%`;
    }
    document.getElementById('zoom-in').onclick = () => setZoom(currentZoom + 0.2);
    document.getElementById('zoom-out').onclick = () => setZoom(currentZoom - 0.2);

    pdfjsLib.getDocument(pdfUrl).promise.then(async (pdf) => {
      statusText.innerText = `Loading 1/${pdf.numPages}...`;

      // Render high-resolution canvases (2x for crisp text)
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 2.0 });

        // 1. Setup Canvas for Flipbook
        const flipPageDiv = document.createElement('div');
        flipPageDiv.className = 'page';
        const flipCanvas = document.createElement('canvas');
        flipCanvas.width = viewport.width;
        flipCanvas.height = viewport.height;
        await page.render({ canvasContext: flipCanvas.getContext('2d'), viewport }).promise;
        flipPageDiv.appendChild(flipCanvas);
        flipContainer.appendChild(flipPageDiv);

        // 2. Clone Canvas for Scroll Mode
        const scrollCanvas = document.createElement('canvas');
        scrollCanvas.width = viewport.width;
        scrollCanvas.height = viewport.height;
        await page.render({ canvasContext: scrollCanvas.getContext('2d'), viewport }).promise;
        scrollContainer.appendChild(scrollCanvas);

        statusText.innerText = `${i}/${pdf.numPages}`;
      }

      statusText.innerText = '';

      // Initialize responsive Flipbook
      const bookWidth = Math.min(window.innerWidth * 0.9, 480);
      const bookHeight = bookWidth * 1.45;

      pageFlip = new St.PageFlip(flipContainer, {
        width: bookWidth,
        height: bookHeight,
        size: 'stretch',
        minWidth: 280,
        maxWidth: 600,
        minHeight: 400,
        maxHeight: 900,
        showCover: true,
        drawShadow: true,
        mobileScrollSupport: false
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));

      document.getElementById('prev-btn').onclick = () => pageFlip.flipPrev();
      document.getElementById('next-btn').onclick = () => pageFlip.flipNext();
      pageFlip.on('flip', (e) => {
        statusText.innerText = `${e.data + 1} / ${pdf.numPages}`;
      });

      // View Mode Toggle (Flip vs Scroll)
      const modeBtn = document.getElementById('mode-btn');
      const flipControls = document.getElementById('flip-controls');

      modeBtn.onclick = () => {
        isScrollMode = !isScrollMode;
        if (isScrollMode) {
          flipContainer.style.display = 'none';
          scrollContainer.style.display = 'flex';
          flipControls.style.display = 'none';
          modeBtn.innerText = 'Mode: Scroll';
        } else {
          flipContainer.style.display = 'block';
          scrollContainer.style.display = 'none';
          flipControls.style.display = 'flex';
          modeBtn.innerText = 'Mode: Book';
          setZoom(1.0);
        }
      };

    }).catch(err => {
      statusText.innerText = 'Error loading book.';
      console.error(err);
    });
  </script>
</body>
</html>
